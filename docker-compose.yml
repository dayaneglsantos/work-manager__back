# 'services' é a seção principal onde definimos todos os nossos contêineres.
# Cada serviço (app, db) rodará em um contêiner separado.
services:
  # --- SERVIÇO DO BANCO DE DADOS MYSQL ---
  # Aqui definimos o contêiner para o nosso banco de dados.
  db:
    # 'image' especifica qual imagem do Docker Hub será usada.
    # 'mysql:8.0' é a imagem oficial do MySQL na versão 8.0.
    image: mysql:8.0

    # 'command' sobrescreve o comando padrão da imagem.
    # Esta linha específica é um "truque" importante para garantir a compatibilidade
    # de autenticação do MySQL 8 com o Prisma e outros clientes Node.js.
    command: --default-authentication-plugin=mysql_native_password

    # 'restart: always' garante que o contêiner do banco de dados será reiniciado
    # automaticamente se ele parar por algum motivo (ex: erro, reinicialização do sistema).
    # restart: always

    # 'environment' define as variáveis de ambiente DENTRO do contêiner do 'db'.
    # A imagem do MySQL usa essas variáveis para se autoconfigurar na primeira vez que sobe.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}

    # 'ports' mapeia portas entre a sua máquina (HOST) e o contêiner (CONTAINER).
    # Formato: "HOST:CONTAINER"
    # "3306:3306" permite que você conecte ferramentas de banco de dados (DBeaver, Workbench)
    # que estão no seu PC à porta 3306 do contêiner MySQL.
    ports:
      - '${DB_PORT}:3306'

    # 'volumes' são usados para persistir dados.
    # Sem isso, todos os dados do banco seriam perdidos ao remover o contêiner.
    # 'db_data:/var/lib/mysql' cria um "volume nomeado" chamado 'db_data' e o associa
    # à pasta onde o MySQL guarda seus dados dentro do contêiner.
    volumes:
      - db_data:/var/lib/mysql

  # --- SERVIÇO DE E-MAIL LOCAL (MAILPIT) ---
  # O Mailpit funciona como um servidor SMTP de desenvolvimento: ele recebe os
  # e-mails enviados pela aplicação, mas não os entrega para endereços reais.
  # As mensagens capturadas podem ser visualizadas em http://localhost:8025.
  mailpit:
    # Imagem oficial do Mailpit publicada no Docker Hub.
    image: axllent/mailpit:latest

    # Nome amigável para identificar o contêiner no Docker Desktop.
    container_name: work-manager-mailpit

    # Reinicia o serviço automaticamente, exceto quando ele for parado manualmente.
    restart: unless-stopped

    # O Mailpit oferece duas interfaces diferentes:
    # - 8025: interface web para visualizar os e-mails capturados;
    # - 1025: servidor SMTP pelo qual o backend enviará os e-mails.
    ports:
      - '8025:8025'
      - '1025:1025'

  # --- SERVIÇO DA APLICAÇÃO NODE.JS ---
  # Aqui definimos o contêiner para a nossa aplicação back-end.
  app:
    # 'build: .' instrui o Docker Compose a construir uma imagem a partir do
    # arquivo 'Dockerfile' localizado no diretório atual ('.').
    build: .

    # 'command' sobrescreve a instrução CMD do Dockerfile.
    # Isso é PERFEITO para desenvolvimento, pois usamos o script 'dev'
    # que tem o 'watch' para reiniciar o servidor a cada alteração no código.
    command: npm run dev

    # Mapeia a porta 3000 do seu PC para a porta 3000 do contêiner,
    # permitindo que você acesse sua API via http://localhost:3000 no navegador.
    # Lembre-se de usar a porta que sua aplicação realmente escuta.
    ports:
      - '${APP_PORT}:3000'

    # Define as variáveis de ambiente para o contêiner da 'app'.
    environment:
      # Esta é a string de conexão que o Prisma usará.
      # O segredo está em '@db': em vez de 'localhost', usamos o nome do serviço
      # do banco de dados ('db'), pois o Docker Compose cria uma rede interna
      # onde os serviços se comunicam por seus nomes.
      DATABASE_URL: 'mysql://${DB_USERNAME}:${DB_PASSWORD}@db:3306/${DB_DATABASE}'

      # Configuração do servidor de e-mail usado no ambiente local.
      # Dentro da rede do Docker Compose, o nome do serviço "mailpit" funciona
      # como endereço. Por isso não usamos "localhost" no SMTP_HOST.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025

      # O Mailpit local não exige TLS nem usuário e senha.
      SMTP_SECURE: 'false'

      # Remetente que aparecerá nos e-mails capturados pelo Mailpit.
      EMAIL_FROM: 'Work Manager <no-reply@work-manager.local>'

    # Volumes para a aplicação. Essencial para o live-reloading.
    volumes:
      # '.:/app' espelha o diretório atual do seu PC para a pasta /app no contêiner.
      # Quando você edita um arquivo no seu PC, ele é atualizado no contêiner instantaneamente.
      - .:/app
      # Esta é uma exceção importante: diz ao Docker para NÃO mapear a pasta
      # 'node_modules' do seu PC. Em vez disso, o contêiner usará a pasta
      # 'node_modules' que foi criada pelo comando 'RUN npm install' no Dockerfile.
      # Isso evita conflitos de dependências entre sistemas operacionais.
      - /app/node_modules

    # 'depends_on' define a ordem de inicialização dos serviços.
    # 'app' só será iniciado DEPOIS que o serviço 'db' estiver pronto.
    # Isso evita que sua aplicação tente se conectar a um banco que ainda não subiu.
    depends_on:
      - db
      - mailpit

# Esta seção no final do arquivo declara formalmente os volumes nomeados
# que foram usados nos serviços. É uma boa prática para gerenciamento.
volumes:
  db_data:
